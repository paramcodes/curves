# Pre-commit is deliberately Biome-only: fast enough to never be worth bypassing.
# Typecheck, knip, tests, and the boot check run in CI (ADR 0002 — lean guardrails).
# Biome v2 skips unknown file types via files.ignoreUnknown, so no unmatched-files flag is needed.
pre-commit:
  jobs:
    - name: biome check
      run: pnpm exec biome check {staged_files}
