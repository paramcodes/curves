name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # verify:full chains check (biome + typecheck + knip) → verify (unit tests) → boot check.
      # Same canonical command as local — no CI-only magic (PLAN.md phase 0).
      - run: pnpm verify:full
